<!DOCTYPE html>
<!-- VIRTUAL TAKEOFF viewer — generated by tools/viewer/build_viewer.py. Do not edit
     the built copy; edit the template. Everything is local: no network, no frameworks.
     The SVG viewBox is in PDF POINTS — overlay coordinates are the evidence file's
     numbers verbatim. "A measurement nobody can see is a measurement nobody can check." -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>virtual takeoff</title>
<style>
  :root{
    --bg:#141a21; --bg2:#1c242e; --edge:#2c3947; --ink:#e8eef4; --dim:#8fa1b3;
    --meas:#34a853; --given:#f0a500; --assumed:#d64545;
    --prim:#4b8fe2; --verif:#b06fd8; --sel:#ffd54a;
  }
  *{box-sizing:border-box; margin:0}
  html,body{height:100%}
  body{background:var(--bg); color:var(--ink);
       font:13px/1.45 "Segoe UI",system-ui,sans-serif; display:flex; flex-direction:column}
  header{display:flex; align-items:center; gap:14px; padding:8px 14px;
         background:var(--bg2); border-bottom:1px solid var(--edge); flex:0 0 auto}
  header h1{font-size:15px; font-weight:600}
  header .sub{color:var(--dim); font-size:11.5px}
  .chip{padding:2px 9px; border-radius:99px; font-size:11px; font-weight:600;
        letter-spacing:.02em; white-space:nowrap}
  .chip.cert{background:#1d4a2c; color:#7ee2a0; border:1px solid #2c7a44}
  .chip.uncert{background:#4a3a1d; color:#ffce6b; border:1px solid #8a6a2c}
  .scalebadge{margin-left:auto; font-size:11.5px; color:var(--dim); padding:3px 10px;
              border:1px solid var(--edge); border-radius:6px; white-space:nowrap}
  .scalebadge.warn{border-color:#a04545; color:#ff9d9d; background:#3a2020}
  #wrap{display:flex; flex:1 1 auto; min-height:0}
  /* ---- sheet rail ---- */
  #rail{flex:0 0 128px; overflow-y:auto; background:var(--bg2);
        border-right:1px solid var(--edge); padding:8px}
  .thumb{position:relative; margin-bottom:10px; cursor:pointer; border:2px solid var(--edge);
         border-radius:4px; overflow:hidden; opacity:.85}
  .thumb img{width:100%; display:block; background:#fff}
  .thumb.current{border-color:var(--sel); opacity:1}
  .thumb .pg{position:absolute; left:4px; top:4px; background:#000a; color:#fff;
             font-size:10px; padding:1px 5px; border-radius:3px}
  .thumb .n{position:absolute; right:4px; top:4px; background:#1d4a2c; color:#9fe2b5;
            font-size:10px; padding:1px 5px; border-radius:3px}
  .thumb .sc{position:absolute; left:4px; bottom:4px; font-size:9.5px; padding:0 4px;
             border-radius:3px; background:#000a; color:#cfd8e3}
  .thumb .sc.warn{background:#5a1f1f; color:#ffb3b3}
  .thumb.norender img{filter:grayscale(.6) brightness(.8)}
  /* ---- canvas ---- */
  #stage{flex:1 1 auto; position:relative; min-width:0; background:#0d1116}
  #svg{width:100%; height:100%; display:block; cursor:grab; touch-action:none}
  #svg.panning{cursor:grabbing}
  .ov{cursor:pointer}
  .ov polygon{fill-opacity:.09; stroke-width:3.5; vector-effect:non-scaling-stroke}
  .ov line{stroke-width:3.5; vector-effect:non-scaling-stroke; stroke-linecap:round}
  .ov.src-MEASURED polygon{stroke:var(--meas); fill:var(--meas)}
  .ov.src-GIVEN polygon{stroke:var(--given); fill:var(--given)}
  .ov.src-ASSUMED polygon{stroke:var(--assumed); fill:var(--assumed)}
  .ov.side-primary polygon{stroke:var(--prim); fill:var(--prim)}
  .ov.side-verification polygon{stroke:var(--verif); fill:var(--verif);
                                stroke-dasharray:14 9}
  svg.has-sel .ov:not(.sel){opacity:.22}
  .ov.sel polygon{stroke:var(--sel); stroke-width:5; fill:var(--sel); fill-opacity:.14}
  .ov.sel line{stroke:var(--sel)!important; stroke-width:5.5}
  #norender-note{position:absolute; left:50%; top:14px; transform:translateX(-50%);
                 background:#3a2020cc; color:#ffb3b3; padding:5px 14px; border-radius:6px;
                 font-size:12px; display:none}
  /* ---- legend ---- */
  #legend{position:absolute; left:12px; bottom:12px; background:#141a21d9;
          border:1px solid var(--edge); border-radius:8px; padding:8px 12px; font-size:11.5px}
  #legend .row{display:flex; align-items:center; gap:7px; margin:2px 0; color:var(--dim)}
  #legend .sw{width:16px; height:0; border-top:3px solid; border-radius:2px}
  #legend .sw.dash{border-top-style:dashed}
  #fitbtn{position:absolute; right:12px; bottom:12px; background:var(--bg2);
          color:var(--ink); border:1px solid var(--edge); border-radius:6px;
          padding:5px 12px; cursor:pointer; font-size:12px}
  /* ---- panel ---- */
  #panel{flex:0 0 380px; overflow-y:auto; background:var(--bg2);
         border-left:1px solid var(--edge); padding:12px 14px 40px}
  #panel h2{font-size:11px; text-transform:uppercase; letter-spacing:.09em;
            color:var(--dim); margin:18px 0 7px; display:flex; align-items:center; gap:8px}
  #panel h2:first-child{margin-top:2px}
  .cert{border:1px solid var(--edge); border-radius:8px; padding:10px 12px; margin-bottom:6px}
  .cert.uncert{border-color:#8a6a2c; background:#2a2416}
  .cert.certok{border-color:#2c7a44; background:#16241b}
  .cert .errs{margin-top:7px; color:#ffce6b; font-size:12px; white-space:pre-wrap}
  .cert .errs div{margin:3px 0; padding-left:14px; text-indent:-14px}
  .card{border:1px solid var(--edge); border-radius:7px; padding:8px 10px; margin:7px 0;
        cursor:pointer}
  .card:hover,.mrow:hover{background:#232e3a}
  .card.sel,.mrow.sel{outline:2px solid var(--sel); background:#2a2f27}
  .card .nm{font-weight:600; margin-bottom:3px}
  .card .ln{display:flex; gap:7px; font-size:12px; color:var(--dim); align-items:center}
  .card .delta{margin-left:auto; font-weight:700}
  .delta.bad{color:#ff8d8d} .delta.ok{color:#7ee2a0}
  .dot{width:9px; height:9px; border-radius:99px; display:inline-block; flex:0 0 auto}
  .mrow{display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px;
        cursor:pointer; border:1px solid transparent}
  .mrow .trade{font-weight:600}
  .mrow .qty{margin-left:auto; font-variant-numeric:tabular-nums; font-weight:600}
  .mrow .unit,.mrow .pg{color:var(--dim); font-size:11.5px}
  .badge{font-size:9.5px; font-weight:700; padding:1px 6px; border-radius:4px;
         letter-spacing:.03em}
  .badge.MEASURED{background:#1d4a2c; color:#7ee2a0}
  .badge.GIVEN{background:#4a3d14; color:#ffd97a}
  .badge.ASSUMED{background:#4a1d1d; color:#ff9d9d}
  .conf{font-size:10px; color:var(--dim)}
  .conf.review,.conf.low{color:#ffce6b}
  .nog{color:var(--dim); font-size:10.5px}
  .mnote{font-size:11.5px; color:var(--dim); padding:2px 8px 8px 26px}
  .nmrow{padding:6px 8px; border-left:3px solid #8a6a2c; margin:6px 0; background:#241f14;
         border-radius:0 6px 6px 0; font-size:12px}
  .nmrow .t{font-weight:600; color:#ffce6b}
  .nmrow .why{color:var(--dim); margin-top:2px}
  .roofrow{display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:6px;
           cursor:pointer}
  .roofrow:hover{background:#232e3a}
  .roofrow .lf{margin-left:auto; font-variant-numeric:tabular-nums; color:var(--dim)}
  input[type=checkbox]{accent-color:var(--sel); cursor:pointer}
  details{margin:8px 0; font-size:12px}
  details summary{cursor:pointer; color:var(--dim)}
  details pre{white-space:pre-wrap; word-break:break-word; background:#10151b;
              border:1px solid var(--edge); border-radius:6px; padding:8px;
              font-size:10.5px; margin-top:6px; max-height:260px; overflow:auto}
  #panel footer{margin-top:26px; font-size:10.5px; color:var(--dim);
                border-top:1px solid var(--edge); padding-top:8px}
  #panel footer a{color:#7fb3e8}
</style>
</head>
<body>
<script id="takeoff-data" type="application/json">__TAKEOFF_DATA__</script>
<header>
  <h1 id="title"></h1>
  <span class="chip" id="status"></span>
  <span class="sub" id="meta"></span>
  <span class="scalebadge" id="scalebadge"></span>
</header>
<div id="wrap">
  <nav id="rail"></nav>
  <main id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="norender-note">this sheet was not part of the takeoff — thumbnail shown;
      geometry coordinates are still exact</div>
    <div id="legend"></div>
    <button id="fitbtn" title="fit sheet (double-click canvas also fits)">fit ⛶</button>
  </main>
  <aside id="panel"></aside>
</div>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("takeoff-data").textContent);
const EV = DATA.evidence, SHEETS = DATA.sheets, ROOF = EV.roof_lines || null;
const CERT = EV.area_certification || null;
const SVGNS = "http://www.w3.org/2000/svg";
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (v, d=1) => (v == null || isNaN(v)) ? "—" :
  Number(v).toLocaleString("en-US", {maximumFractionDigits:d});

/* ---------------- data shaping ---------------- */
// dedupe identical polygons (foundation LF + basement SF share one trace):
// one shape, many measurement ids.
const polyGroups = {};          // key -> {page, points, mids:[], source, trades:[]}
for (const m of EV.measurements || []) {
  const g = m.geometry;
  if (!g || !g.points || !Number.isInteger(m.page)) continue;
  const key = m.page + "|" + JSON.stringify(g.points);
  (polyGroups[key] ??= {page:m.page, points:g.points, mids:[], source:m.source,
                        trades:[], geo:g}).mids.push(m.id);
  polyGroups[key].trades.push(m.trade);
}
const compShapes = [];          // {cid, side, page, points, comp}
if (CERT) for (const c of CERT.components || [])
  for (const side of ["primary", "verification"]) {
    const e = c[side] || {};
    if (e.geometry && e.geometry.points && Number.isInteger(e.page))
      compShapes.push({cid:e.id || c.name + "-" + side, side, page:e.page,
                       points:e.geometry.points, comp:c, ev:e});
  }
const measByPage = {};          // page -> count (rail badges)
for (const m of EV.measurements || [])
  if (Number.isInteger(m.page)) measByPage[m.page] = (measByPage[m.page] || 0) + 1;
for (const s of compShapes) measByPage[s.page] = (measByPage[s.page] || 0) + 0;

const state = {
  page: null,
  sel: null,                    // {type:'m', ids:[]}|{type:'c', cid}|{type:'roof', role}
  layers: {meas:true, primary:true, verification:true,
           roof:Object.fromEntries(Object.keys((ROOF||{}).roles||{}).map(r=>[r,true]))},
};
let vb = [0, 0, 100, 100];      // viewBox in PDF points

/* ---------------- header ---------------- */
document.getElementById("title").textContent = DATA.job + " — virtual takeoff";
document.title = DATA.job + " — virtual takeoff";
const stat = document.getElementById("status");
const okCert = EV.status === "certified";
stat.textContent = okCert ? "CERTIFIED" : "MORE INFORMATION REQUIRED";
stat.className = "chip " + (okCert ? "cert" : "uncert");
document.getElementById("meta").textContent =
  `plan ${(EV.plan_sha256||"").slice(0,10).toLowerCase()}… · ${EV.generated || ""}`;

/* ---------------- sheet rail ---------------- */
const rail = document.getElementById("rail");
for (const entry of DATA.ledger) {
  const pi = entry.page, sh = SHEETS[pi] || {};
  const d = document.createElement("div");
  d.className = "thumb" + (sh.png ? "" : " norender");
  d.dataset.page = pi;
  const det = entry.detect || {};
  const scWarn = !det.ppf || (!det.scale || (det.err_pct != null && det.err_pct > 2));
  const scTxt = det.ppf ? `${fmt(entry.ppf || det.ppf, 2)}` : "no scale";
  d.innerHTML = `<img src="${sh.thumb}" loading="lazy">
    <span class="pg">p${pi + 1}</span>
    ${measByPage[pi] ? `<span class="n">${measByPage[pi]}</span>` : ""}
    <span class="sc${scWarn ? " warn" : ""}" title="${esc(scaleTitle(entry))}">${scTxt}</span>`;
  d.onclick = () => showPage(pi);
  rail.appendChild(d);
}
function scaleTitle(entry) {
  const det = entry.detect || {};
  const bits = [];
  if (entry.ppf) bits.push(`run: ${entry.ppf} pt/ft · ${entry.scale_method} · ${entry.scale_confidence}`);
  if (det.ppf) bits.push(`detect: ${det.ppf} pt/ft · ${det.scale || "NONSTANDARD"} · ` +
                         `${det.confidence} · ${det.votes} votes · ±${det.err_pct}%`);
  if (!det.scale || (det.err_pct != null && det.err_pct > 2))
    bits.push("⚠ off standard scale — print-rescale suspected (1 in 6 sets)");
  return bits.join("\n") || "no scale solved";
}

/* ---------------- canvas ---------------- */
const svg = document.getElementById("svg");
function showPage(pi) {
  state.page = pi;
  for (const t of rail.children) t.classList.toggle("current", +t.dataset.page === pi);
  const sh = SHEETS[pi] || {};
  const W = sh.width_pt, H = sh.height_pt;
  svg.innerHTML = "";
  const img = document.createElementNS(SVGNS, "image");
  img.setAttribute("href", sh.png || sh.thumb);
  img.setAttribute("x", 0); img.setAttribute("y", 0);
  img.setAttribute("width", W); img.setAttribute("height", H);
  svg.appendChild(img);
  document.getElementById("norender-note").style.display = sh.png ? "none" : "block";

  if (state.layers.meas)
    for (const [key, gp] of Object.entries(polyGroups)) {
      if (gp.page !== pi) continue;
      svg.appendChild(shape("polygon", gp.points,
        `ov src-${gp.source}`, {kind:"m", key},
        `${gp.trades.join(" + ")}\n${gp.geo.area_sf ? fmt(gp.geo.area_sf) + " SF" : ""}` +
        `${gp.geo.perim_lf ? " · " + fmt(gp.geo.perim_lf) + " LF" : ""}`));
    }
  for (const s of compShapes) {
    if (s.page !== pi || !state.layers[s.side]) continue;
    svg.appendChild(shape("polygon", s.points, `ov side-${s.side}`, {kind:"c", cid:s.cid},
      `${s.comp.name} — ${s.side}\n${fmt(s.ev.qty)} SF · ${s.ev.method}`));
  }
  if (ROOF && ROOF.page === pi)
    for (const [role, segs] of Object.entries(ROOF.roles || {})) {
      if (!state.layers.roof[role]) continue;
      for (const s of segs) {
        const el = document.createElementNS(SVGNS, "g");
        el.setAttribute("class", "ov roof-" + role);
        el.dataset.kind = "roof"; el.dataset.role = role;
        const ln = document.createElementNS(SVGNS, "line");
        const [x0, y0, x1, y1] = s.seg;
        ln.setAttribute("x1", x0); ln.setAttribute("y1", y0);
        ln.setAttribute("x2", x1); ln.setAttribute("y2", y1);
        ln.setAttribute("stroke", DATA.roof_colors[role] || "#888");
        const ti = document.createElementNS(SVGNS, "title");
        ti.textContent = `${role} · ${fmt(s.len_ft)} ft (plan)`;
        el.appendChild(ti); el.appendChild(ln); svg.appendChild(el);
      }
    }
  vb = [0, 0, W, H]; applyVB();
  applySel();
  updateScaleBadge();
}
function shape(tag, points, cls, ds, title) {
  const g = document.createElementNS(SVGNS, "g");
  g.setAttribute("class", cls);
  for (const [k, v] of Object.entries(ds)) g.dataset[k] = v;
  const p = document.createElementNS(SVGNS, tag);
  p.setAttribute("points", points.map(q => q.join(",")).join(" "));
  const t = document.createElementNS(SVGNS, "title");
  t.textContent = title;
  g.appendChild(t); g.appendChild(p);
  return g;
}
function updateScaleBadge() {
  const entry = DATA.ledger[state.page] || {};
  const det = entry.detect || {};
  const b = document.getElementById("scalebadge");
  const warn = !det.ppf || !det.scale || (det.err_pct != null && det.err_pct > 2);
  const src = entry.ppf ? `${entry.ppf} pt/ft · ${entry.scale_method} · ${entry.scale_confidence}`
            : det.ppf ? `${det.ppf} pt/ft · detect · ${det.confidence} · ${det.votes}✓`
            : "no scale solved";
  b.textContent = `p${state.page + 1} scale: ${src}` + (warn ? "  ⚠ off-standard" : "");
  b.className = "scalebadge" + (warn ? " warn" : "");
  b.title = scaleTitle(entry);
}

/* pan / zoom — exact math incl. preserveAspectRatio letterboxing */
function applyVB(){ svg.setAttribute("viewBox", vb.join(" ")); }
function scaleOf() {
  const r = svg.getBoundingClientRect();
  const s = Math.min(r.width / vb[2], r.height / vb[3]);
  return {r, s, ox:(r.width - vb[2] * s) / 2, oy:(r.height - vb[3] * s) / 2};
}
function toPt(e) {
  const {r, s, ox, oy} = scaleOf();
  return {x: vb[0] + (e.clientX - r.left - ox) / s,
          y: vb[1] + (e.clientY - r.top - oy) / s};
}
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const p = toPt(e), f = e.deltaY < 0 ? 0.87 : 1.15;
  vb = [p.x - (p.x - vb[0]) * f, p.y - (p.y - vb[1]) * f, vb[2] * f, vb[3] * f];
  applyVB();
}, {passive:false});
let pan = null;
svg.addEventListener("pointerdown", e => {
  pan = {x:e.clientX, y:e.clientY, vb:[...vb], s:scaleOf().s, moved:false};
  svg.setPointerCapture(e.pointerId); svg.classList.add("panning");
});
svg.addEventListener("pointermove", e => {
  if (!pan) return;
  const dx = (e.clientX - pan.x) / pan.s, dy = (e.clientY - pan.y) / pan.s;
  if (Math.abs(e.clientX - pan.x) + Math.abs(e.clientY - pan.y) > 4) pan.moved = true;
  vb = [pan.vb[0] - dx, pan.vb[1] - dy, pan.vb[2], pan.vb[3]]; applyVB();
});
svg.addEventListener("pointerup", e => {
  svg.classList.remove("panning");
  const wasClick = pan && !pan.moved; pan = null;
  if (!wasClick) return;
  const g = e.target.closest("g.ov");
  if (!g) { setSel(null); return; }
  if (g.dataset.kind === "m") setSel({type:"m", ids:polyGroups[g.dataset.key].mids});
  else if (g.dataset.kind === "c") setSel({type:"c", cid:g.dataset.cid});
  else if (g.dataset.kind === "roof") setSel({type:"roof", role:g.dataset.role});
});
svg.addEventListener("dblclick", () => fit());
document.getElementById("fitbtn").onclick = () => fit();
function fit() {
  const sh = SHEETS[state.page] || {};
  vb = [0, 0, sh.width_pt, sh.height_pt]; applyVB();
}
function zoomTo(points) {
  const xs = points.map(p => p[0]), ys = points.map(p => p[1]);
  let x0 = Math.min(...xs), x1 = Math.max(...xs),
      y0 = Math.min(...ys), y1 = Math.max(...ys);
  const px = (x1 - x0) * 0.35 + 20, py = (y1 - y0) * 0.35 + 20;
  vb = [x0 - px, y0 - py, (x1 - x0) + 2 * px, (y1 - y0) + 2 * py]; applyVB();
}
addEventListener("keydown", e => { if (e.key === "Escape") setSel(null); });

/* ---------------- selection ---------------- */
function setSel(sel) { state.sel = sel; applySel(); }
function applySel() {
  const sel = state.sel;
  svg.classList.toggle("has-sel", !!sel);
  for (const g of svg.querySelectorAll("g.ov")) {
    let on = false;
    if (sel) {
      if (sel.type === "m" && g.dataset.kind === "m")
        on = polyGroups[g.dataset.key].mids.some(id => sel.ids.includes(id));
      else if (sel.type === "c") on = g.dataset.cid === sel.cid;
      else if (sel.type === "roof") on = g.dataset.role === sel.role;
    }
    g.classList.toggle("sel", on);
  }
  for (const el of document.querySelectorAll(".mrow, .card")) {
    let on = false;
    if (sel) {
      if (sel.type === "m" && el.dataset.mid) on = sel.ids.includes(el.dataset.mid);
      else if (sel.type === "c" && el.dataset.cids)
        on = el.dataset.cids.split(",").includes(sel.cid);
    }
    el.classList.toggle("sel", on);
    if (on && el.scrollIntoView) el.scrollIntoView({block:"nearest"});
  }
}
function selectMeasurement(m) {
  const g = m.geometry;
  if (Number.isInteger(m.page) && m.page !== state.page) showPage(m.page);
  setSel({type:"m", ids:[m.id]});
  if (g && g.points) zoomTo(g.points);
}
function selectComponent(cid, points, page) {
  if (Number.isInteger(page) && page !== state.page) showPage(page);
  setSel({type:"c", cid});
  if (points) zoomTo(points);
}

/* ---------------- right panel ---------------- */
const panel = document.getElementById("panel");
function h2(txt, toggle) {
  const h = document.createElement("h2");
  h.innerHTML = esc(txt);
  if (toggle) h.appendChild(toggle);
  panel.appendChild(h); return h;
}
function layerBox(checked, fn) {
  const c = document.createElement("input");
  c.type = "checkbox"; c.checked = checked; c.title = "show layer";
  c.onclick = e => { fn(c.checked); showPage(state.page); };
  return c;
}

/* certification banner — built FIRST; uncertified is the launch state */
(function certBanner() {
  const d = document.createElement("div");
  d.className = "cert " + (okCert ? "certok" : "uncert");
  const errs = (CERT && CERT.errors || []).concat(
    (EV.status !== "certified" && !CERT) ? ["no area certification block"] : []);
  d.innerHTML = `<b>${okCert ? "✓ Area certification passed"
                             : "✋ Not certified for pricing"}</b>
    <span class="conf"> tolerance ${CERT ? CERT.tolerance_pct : "—"}%</span>
    ${errs.length ? `<div class="errs">${errs.map(e => `<div>• ${esc(e)}</div>`).join("")}</div>` : ""}`;
  panel.appendChild(d);
  for (const c of (CERT && CERT.components) || []) {
    const card = document.createElement("div");
    card.className = "card";
    const p = c.primary || {}, v = c.verification || {};
    card.dataset.cids = [p.id, v.id].filter(Boolean).join(",");
    const bad = c.delta_pct > (CERT.tolerance_pct || 2);
    card.innerHTML = `<div class="nm">${esc(c.name)} <span class="conf">(${esc(c.classification)})</span></div>
      <div class="ln"><span class="dot" style="background:var(--prim)"></span>
        primary ${fmt(p.qty)} SF · ${esc(p.method)}
        ${p.geometry ? "" : `<span class="nog">no geometry${p.geometry_note ? ": " + esc(p.geometry_note) : ""}</span>`}</div>
      <div class="ln"><span class="dot" style="background:var(--verif)"></span>
        verification ${fmt(v.qty)} SF · ${esc(v.method)}
        ${v.geometry ? "" : `<span class="nog">no geometry${v.geometry_note ? ": " + esc(v.geometry_note) : ""}</span>`}
        <span class="delta ${bad ? "bad" : "ok"}">Δ ${fmt(c.delta_pct, 2)}%</span></div>`;
    card.onclick = () => {
      const side = p.geometry ? p : (v.geometry ? v : null);
      selectComponent((side || p).id, side && side.geometry.points, (side || p).page);
    };
    panel.appendChild(card);
  }
})();

/* measurements by trade */
(function measurements() {
  const meas = (EV.measurements || []);
  const withG = meas.filter(m => m.geometry), noG = meas.filter(m => !m.geometry);
  h2(`Measured — on the sheet (${withG.length})`,
     layerBox(true, v => state.layers.meas = v));
  for (const m of withG) panel.appendChild(mrow(m, true));
  if (noG.length) {
    h2(`Measured — no geometry (${noG.length})`);
    for (const m of noG) panel.appendChild(mrow(m, false));
  }
  const nm = EV.not_measured || [];
  if (nm.length) {
    h2(`Not measured (${nm.length})`);
    for (const n of nm) {
      const d = document.createElement("div");
      d.className = "nmrow";
      d.innerHTML = `<div class="t">${esc(n.trade)} <span class="conf">p${Number.isInteger(n.page) ? n.page + 1 : "?"}</span></div>
                     <div class="why">${esc(n.why)}</div>`;
      panel.appendChild(d);
    }
  }
})();
function mrow(m, locatable) {
  const wrapd = document.createElement("div");
  const d = document.createElement("div");
  d.className = "mrow"; d.dataset.mid = m.id;
  const pg = Array.isArray(m.page) ? m.page.join(", ")
           : Number.isInteger(m.page) ? "p" + (m.page + 1) : "";
  d.innerHTML = `<span class="badge ${esc(m.source)}">${esc(m.source)}</span>
    <span class="trade">${esc(m.trade)}</span>
    <span class="conf ${esc(m.confidence)}">${esc(m.confidence)}</span>
    ${locatable ? "" : `<span class="nog">not locatable — ${esc(m.method)}</span>`}
    <span class="qty">${fmt(m.qty)}</span><span class="unit">${esc(m.unit)}</span>
    <span class="pg">${esc(pg)}</span>`;
  d.onclick = () => selectMeasurement(m);
  wrapd.appendChild(d);
  if (m.note) {
    const n = document.createElement("div");
    n.className = "mnote"; n.textContent = m.note;
    wrapd.appendChild(n);
  }
  return wrapd;
}

/* roof roles */
(function roof() {
  if (!ROOF) return;
  h2(`Roof lines — p${ROOF.page + 1} (pitch ×${ROOF.pitch_factor})`);
  const lf = ROOF.lf || {};
  for (const [role, segs] of Object.entries(ROOF.roles || {})) {
    const d = document.createElement("div");
    d.className = "roofrow"; d.dataset.role = role;
    const box = layerBox(state.layers.roof[role], v => state.layers.roof[role] = v);
    d.appendChild(box);
    const sw = document.createElement("span");
    sw.className = "dot"; sw.style.background = DATA.roof_colors[role] || "#888";
    d.appendChild(sw);
    const lbl = document.createElement("span");
    lbl.textContent = `${role.replace("_", "/")} (${segs.length})`;
    d.appendChild(lbl);
    const val = document.createElement("span");
    val.className = "lf";
    val.textContent = lf[role + "_lf"] != null ? fmt(lf[role + "_lf"]) + " LF" : "";
    d.appendChild(val);
    d.onclick = e => {
      if (e.target === box) return;
      if (ROOF.page !== state.page) showPage(ROOF.page);
      setSel({type:"roof", role});
    };
    panel.appendChild(d);
  }
  const tot = document.createElement("div");
  tot.className = "mnote";
  tot.textContent = `fascia ${fmt(lf.fascia_lf)} LF (eave+rake, slope-corrected) · ` +
                    `gutter ${fmt(lf.gutter_lf)} LF · confidence ${ROOF.confidence}`;
  panel.appendChild(tot);
})();

/* components layer toggles + checks + footer */
(function tail() {
  if (compShapes.length) {
    const h = h2("Component layers");
    for (const side of ["primary", "verification"]) {
      const lab = document.createElement("label");
      lab.style.cssText = "margin-right:14px;font-size:12px;color:var(--dim);cursor:pointer";
      const box = layerBox(true, v => state.layers[side] = v);
      lab.appendChild(box);
      lab.appendChild(document.createTextNode(" " + side));
      h.insertAdjacentElement("afterend", lab);
    }
  }
  const checks = EV.checks || [];
  if (checks.length) {
    const det = document.createElement("details");
    det.innerHTML = `<summary>Checks & audits (${checks.length})</summary>
      <pre>${esc(JSON.stringify(checks, null, 1))}</pre>`;
    panel.appendChild(det);
  }
  const asm = EV.assumptions || [];
  if (asm.length) {
    const det = document.createElement("details");
    det.innerHTML = `<summary>Assumptions (${asm.length})</summary>
      <pre>${esc(asm.join("\n"))}</pre>`;
    panel.appendChild(det);
  }
  const f = document.createElement("footer");
  f.innerHTML = `frame: ${esc(EV.coordinate_frame)}<br>
    evidence: <a href="${esc(DATA.evidence_rel)}">takeoff_evidence.json</a> ·
    plan sha ${esc((EV.plan_sha256 || "").slice(0, 16).toLowerCase())}…`;
  panel.appendChild(f);
})();

/* start on the first rendered page with measurements, else first rendered */
(function start() {
  const rendered = Object.keys(SHEETS).filter(k => SHEETS[k].png).map(Number);
  const withMeas = rendered.filter(p => measByPage[p]);
  showPage((withMeas.length ? withMeas : rendered.length ? rendered : [0])[0]);
})();

/* legend */
(function legend() {
  const L = document.getElementById("legend");
  const rows = [["var(--meas)", "MEASURED", ""], ["var(--given)", "GIVEN", ""],
                ["var(--assumed)", "ASSUMED", ""],
                ["var(--prim)", "component primary", ""],
                ["var(--verif)", "component verification", "dash"]];
  let htmlL = rows.map(([c, t, d]) =>
    `<div class="row"><span class="sw ${d}" style="border-color:${c}"></span>${t}</div>`).join("");
  if (ROOF) htmlL += Object.keys(ROOF.roles || {}).map(r =>
    `<div class="row"><span class="sw" style="border-color:${DATA.roof_colors[r]}"></span>` +
    `roof ${r.replace("_", "/")}</div>`).join("");
  L.innerHTML = htmlL;
})();
</script>
</body>
</html>
